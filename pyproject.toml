[project]
name = "trae-to-ctx"
version = "0.1.0"
description = "Decrypt the Trae IDE's local agent history and export it to Markdown or ctx's JSONL import format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vUvu" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
keywords = ["trae", "ctx", "agent history", "export", "sqlcipher"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/vuvuvu/trae-to-ctx"

[project.scripts]
trae-to-ctx = "trae_to_ctx.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
